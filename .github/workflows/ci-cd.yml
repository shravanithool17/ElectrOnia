name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # =========================================================================
  # 1. Continuous Integration (CI): Test & Lint
  # =========================================================================
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest

    services:
      # In-memory MongoDB replica set or standalone for testing
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            forentend/package-lock.json

      # --- Backend Tests ---
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Backend Tests
        working-directory: ./backend
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-at-least-32-characters-long
          MONGO_URI: mongodb://localhost:27017/test_db
        run: npm test

      # --- Frontend Tests & Build ---
      - name: Install Frontend Dependencies
        working-directory: ./forentend
        run: npm ci

      - name: Validate Frontend Build
        working-directory: ./forentend
        run: npm run build

  # =========================================================================
  # 2. Build & Push Docker Images
  # =========================================================================
  build-and-push:
    name: Build & Push Docker Images
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build & Push Backend
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/electronia-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/electronia-backend:${{ github.sha }}

      # Build & Push Frontend
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./forentend
          file: ./forentend/Dockerfile
          build-args: |
            VITE_API_URL=${{ secrets.PROD_API_URL }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/electronia-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/electronia-frontend:${{ github.sha }}

  # =========================================================================
  # 3. Continuous Deployment (CD): Deploy to Server
  # =========================================================================
  deploy:
    name: Deploy to Production
    needs: build-and-push
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH to VPS / Cloud Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/electronia
            # Pull newest production docker images
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/electronia-backend:latest
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/electronia-frontend:latest

            # Export images and restart containers with zero/minimal downtime
            export DOCKER_IMAGE_BACKEND=${{ secrets.DOCKERHUB_USERNAME }}/electronia-backend:latest
            export DOCKER_IMAGE_FRONTEND=${{ secrets.DOCKERHUB_USERNAME }}/electronia-frontend:latest
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Clean dangling images
            docker image prune -f
